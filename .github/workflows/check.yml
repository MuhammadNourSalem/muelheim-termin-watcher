name: Mülheim Termin Check

on:
  schedule:
    # كل 5 دقائق (GitHub لا يضمن الدقة 100% وقد يتأخر قليلاً وقت الازدحام)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # يسمح بتشغيل يدوي من تبويب Actions للاختبار

jobs:
  check-termine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run appointment check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save run log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add run_log.json
          git diff --staged --quiet || git commit -m "log run [skip ci]"
          git pull --rebase origin main || true
          git push || true

      - name: Upload debug screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
            *.log
            debug_*.html
          if-no-files-found: ignore
          retention-days: 3
